[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemblelab"
version = "0.1.0"
description = "Ensemble descriptors for molecular conformational flexibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ensemblelab contributors" }]
dependencies = [
	"ase>=3.28",
	"numpy>=1.26",
	"rdkit>=2024.3",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
]
# Plotting helpers (rmsd_heatmap, plot_basin_analysis). Imported lazily.
plot = ["matplotlib>=3.8"]
# Everything needed to run the repository notebooks in Jupyter / VS Code.
notebooks = [
	"matplotlib>=3.8",
	"pandas>=2.0",
	"ipykernel>=6",
]
# GFN2-xTB backend. tblite publishes PyPI wheels for Linux only; on macOS and
# Windows install it from conda-forge instead: `conda install -c conda-forge tblite-python`.
xtb = ["tblite>=0.4"]
# ORCA is an external executable and cannot be pip-installed. Install it
# separately and pass its full path as `orca_command`, or set `[orca] command`
# in ASE's config file. This extra is intentionally empty.
orca = []

[tool.hatch.build.targets.wheel]
packages = ["src/ensemblelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
