[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemblelab"
version = "0.1.0"
description = "Tools for studying how conformer sampling size affects ensemble-level molecular properties."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Avirneni" }]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
	"ase>=3.28",
	"numpy>=1.26",
	"rdkit>=2024.3",
]

[project.urls]
Homepage = "https://github.com/dhruvavirneni/ensemblelab"
Repository = "https://github.com/dhruvavirneni/ensemblelab"
Documentation = "https://github.com/dhruvavirneni/ensemblelab/wiki"
Issues = "https://github.com/dhruvavirneni/ensemblelab/issues"

[project.optional-dependencies]
dev = [
	"pytest>=8",
]
# Plotting helpers (rmsd_heatmap, plot_basin_analysis). Imported lazily.
plot = ["matplotlib>=3.8"]
# Everything needed to run the repository notebooks in Jupyter / VS Code.
notebooks = [
	"matplotlib>=3.8",
	"pandas>=2.0",
	"ipykernel>=6",
]
# GFN2-xTB backend. tblite publishes PyPI wheels for Linux only; on macOS and
# Windows install it from conda-forge instead: `conda install -c conda-forge tblite-python`.
xtb = ["tblite>=0.4"]
# ORCA is an external executable and cannot be pip-installed. Install it
# separately and pass its full path as `orca_command`, or set `[orca] command`
# in ASE's config file. This extra is intentionally empty.
orca = []

[tool.hatch.build.targets.wheel]
packages = ["src/ensemblelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
